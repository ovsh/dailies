name: Windows unsigned beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag (e.g. v0.5.6)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload-unsigned-beta:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DAILIES_TELEMETRY_URL: ${{ secrets.DAILIES_TELEMETRY_URL }}
      DAILIES_TELEMETRY_TOKEN: ${{ secrets.DAILIES_TELEMETRY_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Validate release boundary
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not an exact release tag (vX.Y.Z)."
          }
          $version = $tag.TrimStart('v')
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version) {
            throw "package.json version $($package.version) does not match $tag."
          }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -ne $version -or $lock.packages[''].version -ne $version) {
            throw "package-lock.json does not match $tag."
          }
          $checkedOutTag = git describe --tags --exact-match HEAD
          if ($LASTEXITCODE -ne 0 -or $checkedOutTag -ne $tag) {
            throw "The checked-out commit is not tagged $tag."
          }
          foreach ($name in 'DAILIES_TELEMETRY_URL', 'DAILIES_TELEMETRY_TOKEN') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "$name is required for a release build."
            }
          }

      - name: Install dependencies
        run: npm ci

      # ffmpeg-static downloads its binary during npm ci with no checksum of
      # its own; ffprobe-static ships prebuilt binaries. Verify the exact
      # bytes before they go into a shipped build (see the green-noise proxy
      # incident, 0.5.x). Update pins in scripts/verify-media-binaries.mjs
      # only after testing a new build on real MXF/DNxHD media.
      - name: Verify pinned media binaries
        run: node scripts/verify-media-binaries.mjs

      - name: Install telemetry dependencies
        run: npm ci --prefix infra/telemetry

      - name: Add pinned Windows Whisper runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip'
          $expectedSha256 = '7d8be46ecd31828e1eb7a2ecdd0d6b314feafd82163038ab6092594b0a063539'
          $archive = Join-Path $env:RUNNER_TEMP 'whisper-bin-x64-v1.9.1.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'whisper-bin-x64-v1.9.1'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "whisper.cpp archive checksum mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $cli = Get-ChildItem $expanded -Recurse -File -Filter whisper-cli.exe | Select-Object -First 1
          if ($null -eq $cli) { throw 'whisper.cpp v1.9.1 did not contain whisper-cli.exe.' }
          New-Item vendor/whisper -ItemType Directory -Force | Out-Null
          Copy-Item $cli.FullName vendor/whisper/whisper-cli.exe
          Get-ChildItem $cli.DirectoryName -File -Filter *.dll | Copy-Item -Destination vendor/whisper
          if (-not (Test-Path vendor/whisper/whisper-cli.exe)) {
            throw 'The Windows Whisper runtime was not staged.'
          }

      - name: Check and test
        run: |
          npm run typecheck
          npm test

      # The telemetry service is a separate Vercel project with its own tests
      # (node:test, no dependencies to install — the reducers import nothing).
      # Files are named explicitly rather than globbed: cmd.exe does not expand
      # a glob, and the runner's node is 22.x, where TypeScript still needs the
      # --experimental-strip-types flag the script carries.
      - name: Test telemetry aggregation
        run: npm --prefix infra/telemetry test

      - name: Build unsigned NSIS beta
        run: |
          npm run icon
          npm run native:electron
          npm run build:renderer
          npm run build:main:stable
          npm run verify:main:stable
          npx electron-builder --win nsis --x64 --publish never --config.forceCodeSigning=false --config.win.signExecutable=false

      - name: Verify unsigned beta and update metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Dailies-$version-Setup-x64.exe"
          $app = 'release/win-unpacked/Dailies.exe'
          $blockmap = "$installer.blockmap"
          $manifestPath = 'release/latest.yml'
          foreach ($path in $installer, $app, $blockmap, $manifestPath) {
            if (-not (Test-Path $path)) { throw "Missing release file: $path" }
          }
          foreach ($path in $installer, $app) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'NotSigned') {
              throw "$path must be unsigned for this beta, got Authenticode status: $($signature.Status)"
            }
          }
          $whisperBinaries = @(Get-ChildItem 'release/win-unpacked/resources/whisper' -Recurse -File -Include *.exe,*.dll)
          if ($whisperBinaries.Count -eq 0) { throw 'The packaged Whisper runtime is missing.' }
          foreach ($binary in $whisperBinaries) {
            $signature = Get-AuthenticodeSignature $binary.FullName
            if ($signature.Status -notin 'Valid', 'NotSigned') {
              throw "$($binary.FullName) has invalid Authenticode status: $($signature.Status)"
            }
          }
          $escapedVersion = [regex]::Escape($version)
          $manifest = Get-Content $manifestPath -Raw
          if ($manifest -notmatch "(?m)^version:\s*$escapedVersion\s*$") {
            throw 'latest.yml has the wrong version.'
          }
          if ($manifest -notmatch "(?m)^path:\s*Dailies-$escapedVersion-Setup-x64\.exe\s*$") {
            throw 'latest.yml points at the wrong installer.'
          }
          $shaLine = [regex]::Match($manifest, '(?m)^sha512:\s*(\S+)\s*$')
          if (-not $shaLine.Success) { throw 'latest.yml has no SHA-512 digest.' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $installer))
          $actualSha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData($bytes))
          if ($shaLine.Groups[1].Value -ne $actualSha) {
            throw 'latest.yml SHA-512 does not match the installer.'
          }

      - name: Smoke-test a fresh Windows profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'dailies-fresh-profile'
          $log = Join-Path $env:RUNNER_TEMP 'dailies-smoke.log'
          $process = Start-Process 'release/win-unpacked/Dailies.exe' `
            -ArgumentList "--user-data-dir=$profile", '--disable-gpu', '--enable-logging', "--log-file=$log" `
            -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            $details = if (Test-Path $log) { Get-Content $log -Raw } else { 'No Electron log was written.' }
            throw "Dailies exited during the fresh-profile smoke test. $details"
          }
          Stop-Process -Id $process.Id
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          if (-not (Test-Path $profile)) {
            throw 'Dailies did not create the isolated user-data directory.'
          }

      - name: Upload to existing draft without clobbering
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Draft release $tag does not exist." }
          if (-not $release.isDraft) { throw "Release $tag is not a draft. Refusing to replace it." }
          $paths = @(
            "release/Dailies-$version-Setup-x64.exe",
            "release/Dailies-$version-Setup-x64.exe.blockmap",
            'release/latest.yml'
          )
          $existingNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($path in $paths) {
            $name = Split-Path $path -Leaf
            if ($existingNames -contains $name) {
              $downloadDir = Join-Path $env:RUNNER_TEMP "existing-$name"
              New-Item $downloadDir -ItemType Directory -Force | Out-Null
              gh release download $tag --pattern $name --dir $downloadDir
              if ($LASTEXITCODE -ne 0) { throw "Could not download existing asset $name." }
              $localHash = (Get-FileHash $path -Algorithm SHA256).Hash
              $remoteHash = (Get-FileHash (Join-Path $downloadDir $name) -Algorithm SHA256).Hash
              if ($localHash -ne $remoteHash) {
                throw "Draft asset $name exists with different bytes."
              }
              Write-Host "Keeping identical draft asset $name."
            } else {
              gh release upload $tag $path
              if ($LASTEXITCODE -ne 0) { throw "Could not upload $name." }
            }
          }
          Write-Host 'Unsigned Windows beta assets are on the draft. Add the Mac assets and publish manually.'
